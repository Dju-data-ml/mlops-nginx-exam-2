events {
    worker_connections 1024; # Nombre maximum de connexions par processus
}

http {
    upstream lb-api-v1 {
        server api-v1:8000;
    }

    # listen on 80 but redirect to https
    server {
        listen 80;
        server_name localhost;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl; 
        server_name localhost;
        ssl_certificate /etc/nginx/certs/nginx.crt;
        ssl_certificate_key /etc/nginx/certs/nginx.key;
        # Protocoles et chiffrements SSL
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        location /predict {
            proxy_pass http://lb-api-v1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # requiert auth sur ce endpoint
            auth_basic "API Access Restricted"; 
            auth_basic_user_file /etc/nginx/.htpasswd;
        
        }
    }
}