events {
    worker_connections 1024; # Nombre maximum de connexions par processus
}

http {
    upstream lb-api-v1 {
        server api-v1:8000;
    }
    upstream api-v2 {
        server api-v2:8000;
    }

    # header mapping for A/B testing
    map $http_x_experiment_group $api_loc {
        default lb-api-v1;
        "~*debug" api-v2;
    }

    # limits
    limit_req_zone $binary_remote_addr zone=apilimit:10m rate=10r/s;

    # listen on 80 but redirect to https
    server {
        listen 80;
        server_name localhost;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl; 
        server_name localhost;
        ssl_certificate /etc/nginx/certs/nginx.crt;
        ssl_certificate_key /etc/nginx/certs/nginx.key;
        # Protocols & SSL ciphers
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        location /predict {
            proxy_pass http://$api_loc;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # rate limit
            limit_req zone=apilimit burst=5 nodelay;

            # auth req
            auth_basic "API Access Restricted"; 
            auth_basic_user_file /etc/nginx/.htpasswd;
        
        }
    }
}